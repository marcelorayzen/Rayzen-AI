name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite re-rodar sob demanda pela aba Actions ou via `gh workflow run CI` —
  # útil quando o ingest de QA falha por indisponibilidade momentânea da API e
  # basta tentar de novo, sem precisar de um commit vazio só pra isso.
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Generate Prisma client v2
        run: pnpm --filter api-v2 db:generate

      - name: Type check
        run: pnpm typecheck

      - name: Check role-policy drift (ADR-004)
        run: pnpm check:role-drift

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Generate Prisma client v2
        run: pnpm --filter api-v2 db:generate

      - name: Lint
        run: pnpm lint

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # impact:check precisa do histórico completo pra diff contra a base

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Generate Prisma client v2
        run: pnpm --filter api-v2 db:generate

      # Roda os testes de TODOS os apps do workspace e envia um único run consolidado.
      # Antes: só o apps/api virava número no Rayzen (225), enquanto api-v2 e agent
      # rodavam em passos separados e nunca eram contados — o painel mostrava menos da
      # metade das suítes como se fosse o repositório inteiro.
      #
      # Sem continue-on-error de propósito: se o envio falhar, o job fica vermelho. Foi
      # exatamente o silêncio (curl -sf + continue-on-error) que deixou o número
      # congelado em 24/jul por 12 dias sem ninguém perceber.
      - name: Testes do monorepo + ingest no Rayzen
        env:
          RAYZEN_API_URL:    https://api.rayzen.com.br
          RAYZEN_API_TOKEN:  ${{ secrets.RAYZEN_AGENT_TOKEN }}
          RAYZEN_PROJECT_ID: 7690370b-aa1e-4b13-8335-a8a14ad0d859
        run: pnpm qa:ingest --coverage

      - name: Run E2E tests
        run: pnpm --filter api test:e2e

      - name: Impact analysis pré-deploy
        if: always()
        continue-on-error: true
        env:
          RAYZEN_API_TOKEN: ${{ secrets.RAYZEN_AGENT_TOKEN }}
          RAYZEN_API_URL: https://api.rayzen.com.br
          RAYZEN_PROJECT_ID: 7690370b-aa1e-4b13-8335-a8a14ad0d859
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: pnpm impact:check

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 7

  build-smoke:
    name: Docker Build + Smoke
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker compose build api

      - name: Build API-V2 image
        run: docker compose build api-v2

      - name: Build Web image
        run: docker compose build web

      - name: Build Agent Server image
        run: docker compose build agent-server

      - name: Smoke test (requer secrets configurados no repositório GitHub)
        continue-on-error: true
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AGENT_TOKEN: ${{ secrets.RAYZEN_AGENT_TOKEN }}
        run: |
          docker compose up -d postgres redis litellm api api-v2 web
          sleep 45
          curl -sf http://localhost:3101/docs > /dev/null && echo "api OK" || echo "api FAIL"
          curl -sf http://localhost:3103/v2/docs > /dev/null && echo "api-v2 OK" || echo "api-v2 FAIL"
          curl -sf http://localhost:3100 > /dev/null && echo "web OK" || echo "web FAIL"
          docker compose down

  # Deploy é feito manualmente via SSH ou jarvis:restart_api
