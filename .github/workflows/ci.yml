name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Generate Prisma client v2
        run: pnpm --filter api-v2 db:generate

      - name: Type check
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Generate Prisma client v2
        run: pnpm --filter api-v2 db:generate

      - name: Lint
        run: pnpm lint

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # impact:check precisa do histórico completo pra diff contra a base

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Generate Prisma client v2
        run: pnpm --filter api-v2 db:generate

      - name: Run unit tests with coverage
        run: pnpm --filter api test:cov

      - name: Ingest JUnit report no Rayzen
        if: always()
        continue-on-error: true
        env:
          RAYZEN_AGENT_TOKEN: ${{ secrets.RAYZEN_AGENT_TOKEN }}
        run: |
          if [ -z "$RAYZEN_AGENT_TOKEN" ] || [ ! -f apps/api/junit/junit.xml ]; then
            echo "Sem token ou junit.xml — pulando ingest"
            exit 0
          fi
          jq -n \
            --arg content "$(cat apps/api/junit/junit.xml)" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            '{format: "junit", tool: "github-actions", projectId: "7690370b-aa1e-4b13-8335-a8a14ad0d859", branch: $branch, commitHash: $commit, reportContent: $content}' \
          | curl -sf -X POST "https://api.rayzen.com.br/qa/reports/ingest" \
              -H "Authorization: Bearer $RAYZEN_AGENT_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-

      - name: Run api-v2 tests
        run: pnpm --filter api-v2 test

      - name: Run E2E tests
        run: pnpm --filter api test:e2e

      - name: Impact analysis pré-deploy
        if: always()
        continue-on-error: true
        env:
          RAYZEN_API_TOKEN: ${{ secrets.RAYZEN_AGENT_TOKEN }}
          RAYZEN_API_URL: https://api.rayzen.com.br
          RAYZEN_PROJECT_ID: 7690370b-aa1e-4b13-8335-a8a14ad0d859
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: pnpm impact:check

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 7

  # Deploy é feito manualmente via SSH ou jarvis:restart_api
  # O Azure NSG restringe a porta 22 a IPs específicos — GitHub Actions não tem IP fixo
