# Stack isolada do Catalog Guardian — nunca compartilha Postgres/Redis com o
# resto do Rayzen (ver BLUEPRINT.md § Posicionamento). O sandbox OpenMetadata
# NÃO sobe aqui — ver README.md "Sandbox OpenMetadata" para instruções de
# como rodar o docker-compose-quickstart oficial deles e apontar
# OPENMETADATA_URL pra ele.
name: catalog-guardian

services:
  postgres:
    image: postgres:16
    container_name: catalog-guardian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog_guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog_guardian_dev}
      POSTGRES_DB: catalog_guardian
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - catalog_guardian_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catalog_guardian']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: catalog-guardian-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:16379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog-guardian-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      CATALOG_GUARDIAN_API_KEY: ${CATALOG_GUARDIAN_API_KEY:?defina CATALOG_GUARDIAN_API_KEY no .env antes de subir}
      DATABASE_URL: postgresql://catalog_guardian:${POSTGRES_PASSWORD:-catalog_guardian_dev}@postgres:5432/catalog_guardian
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENMETADATA_URL: ${OPENMETADATA_URL:-http://host.docker.internal:8585/api}
      OPENMETADATA_TOKEN: ${OPENMETADATA_TOKEN:-}
      LITELLM_URL: ${LITELLM_URL:-http://host.docker.internal:4100}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-gpt-4o}
      PORT: 4001
    ports:
      - '127.0.0.1:4001:4001'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  catalog_guardian_pgdata:
