# 9. AMBÍGUAS — DEVE PEDIR ESCLARECIMENTO  (4 casos)
# ---------------------------------------------------------------------------

  - id: AMB-001
    categoria: ambigua
    pergunta: "quero dados de vendas"
    intencao: "Pedido amplo demais para resposta útil"
    comportamento_esperado: esclarecer
    criterio_validacao: >
      Faz no máximo duas perguntas objetivas (granularidade, período, sistema
      de origem) antes de responder. Não despeja lista de vinte ativos.
    exige_citacao: false
    perfil: geral
    severidade: alta
    observacao: >
      Despejar tudo é o comportamento padrão de RAG mal ajustado e é o que
      afasta o usuário de negócio.

  - id: AMB-002
    categoria: ambigua
    pergunta: "preciso de informação de cliente"
    intencao: "Pedido genérico com implicação de PII"
    comportamento_esperado: esclarecer
    criterio_validacao: >
      Pergunta a finalidade antes de listar, dado que ativos de cliente
      envolvem dado pessoal.
    exige_citacao: false
    perfil: geral
    severidade: alta
