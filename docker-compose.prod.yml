# docker-compose.prod.yml — sobrescreve docker-compose.yml para produção
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Diferenças em relação ao compose de dev:
#  - Portas internas não publicadas (Nginx como reverse proxy)
#  - restart: always
#  - Limites de memória por serviço
#  - Log rotation (json-file)
#  - Nginx + Certbot para HTTPS

services:
  postgres:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  litellm:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    restart: always
    ports: []
    env_file: .env.production
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  agent-server:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    restart: always
    ports: []
    env_file: .env.production
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Executar manualmente: docker compose run certbot certonly --webroot -w /var/www/certbot -d SEU_DOMINIO
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  pg_data:
  redis_data:
  certbot_www:
  certbot_conf:
