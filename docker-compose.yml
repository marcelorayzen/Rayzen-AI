services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: rayzen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
      POSTGRES_DB: rayzen_ai
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rayzen']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml
    command: --config /app/config.yaml --port 4000
    ports:
      - '127.0.0.1:4100:4000'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage/evidence:/app/storage/evidence
    ports:
      - '127.0.0.1:3101:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3001/docs', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-server:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AGENT_ROLE: server
      AGENT_API_URL: http://api:3001
      AGENT_TOKEN: ${AGENT_TOKEN}
      AGENT_POLL_INTERVAL_MS: 3000
      SERVER_API_CONTAINER: rayzen-ai-api-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api

  mcp-http:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile.server
    restart: unless-stopped
    command: node apps/agent/src/mcp/rayzen-mcp-http.mjs
    environment:
      NODE_ENV: production
      AGENT_API_URL: http://api:3001
      AGENT_TOKEN: ${AGENT_TOKEN}
      MCP_PORT: 3102
      MCP_PROJECT_ID: ${MCP_PROJECT_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-claude-ai}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      MCP_BASE_URL: ${MCP_BASE_URL:-https://rayzen.com.br}
    volumes:
      - ./storage/mcp:/app/storage/mcp
    ports:
      - '127.0.0.1:3102:3102'
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3101}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3101}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - '127.0.0.1:3100:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-v2:
    build:
      context: .
      dockerfile: apps/api-v2/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL_V2: postgresql://rayzen:${POSTGRES_PASSWORD:-senha}@postgres:5432/rayzen_ai?schema=v2
      DATABASE_URL: postgresql://rayzen:${POSTGRES_PASSWORD:-senha}@postgres:5432/rayzen_ai
      API_V2_PORT: 3002
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
      V1_API_URL: http://api:3001
      V1_API_TOKEN: ${AGENT_TOKEN}
    ports:
      - '127.0.0.1:3103:3002'
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3002/v2/docs', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: '0.0.0.0:11434'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./storage/previews:/srv/previews:ro
    depends_on:
      - mcp-http

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  ollama_data:
