services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: rayzen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
      POSTGRES_DB: rayzen_ai
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rayzen']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml
    command: --config /app/config.yaml --port 4000
    ports:
      - '4100:4000'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./storage/evidence:/app/storage/evidence
    ports:
      - '3101:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/docs > /dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-server:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AGENT_ROLE: server
      AGENT_API_URL: http://api:3001
      AGENT_TOKEN: ${AGENT_TOKEN}
      AGENT_POLL_INTERVAL_MS: 3000
      SERVER_API_CONTAINER: rayzen-ai-api-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3101}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - '3100:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ > /dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pg_data:
  redis_data:
