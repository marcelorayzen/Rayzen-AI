model_list:
  # Chat principal — Groq 70b (primário) + Claude Sonnet (fallback)
  - model_name: gpt-4o
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  # Chamadas leves — Groq 8b (primário, quota muito maior) + Claude Haiku (fallback)
  - model_name: gpt-4o-mini
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # Speech to Text
  - model_name: whisper-1
    litellm_params:
      model: groq/whisper-large-v3-turbo
      api_key: os.environ/GROQ_API_KEY

  # Text to Speech
  - model_name: tts-1
    litellm_params:
      model: groq/playai-tts
      api_key: os.environ/GROQ_API_KEY

  # Embeddings (mantém OpenAI pois Groq não tem)
  - model_name: embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  routing_strategy: least-busy
  allowed_fails: 2
  cooldown_time: 60
  # Fallback automático: se Groq rate-limitar, usa Anthropic
  fallbacks:
    - gpt-4o:
        - gpt-4o-anthropic
    - gpt-4o-mini:
        - gpt-4o-mini-anthropic
